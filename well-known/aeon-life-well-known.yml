description: >-
  Aeon Life Insurance Company, Ltd. (百年人寿) publishes no well-known discovery document
  on any host reachable from this record. The corporate site www.aeonlife.com.cn returns a
  548-byte nginx 404 page for every /.well-known/ path probed. The apex aeonlife.com.cn has
  no A record and does not connect. The group flexible-benefits gateway o2o.aeonlife.com.cn
  answers HTTP 200 with application/json for EVERY path — a catch-all authentication
  envelope ({"resultCode":"-3","resultMsg":"请求访问：<path>，认证失败，无法访问系统资源"}),
  not a discovery document — so each of those rows is recorded as a miss (real_document:
  false). No document returned a real payload, so no raw file was saved and NO WellKnown or
  SecurityTxt pointer is emitted in apis.yml.
