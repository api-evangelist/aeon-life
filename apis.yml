aid: aeon-life
name: Aeon Life
description: 'Aeon Life Insurance Company, Ltd. (百年人寿保险股份有限公司, "AEON LIFE") is
  a Chinese life insurer headquartered in Dalian, Liaoning, established on 1 June 2009
  with registered capital of RMB 7.9048 billion. Its licensed scope covers life, health
  and personal accident insurance and other personal-insurance lines, reinsurance of those
  lines, and regulated insurance-fund investment business, sold across twenty provinces
  and municipalities including Dalian, Liaoning, Beijing, Hubei, Hebei, Henan, Jiangsu,
  Shandong, Sichuan, Guangdong, Zhejiang and Chongqing. Its public web presence is a
  Chinese-language corporate site with an online insurance mall, claims and policy-service
  sections, and the information-disclosure pages Chinese insurance regulation requires.
  The company publishes no developer portal, no API documentation and no machine-readable
  API contract; its group flexible-benefits platform (o2o.aeonlife.com.cn) and e-insurance
  customer portal both sit behind logins.'
